# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Manual_MelodyOfMemory_BigBirdRito Template

game: Manual_MelodyOfMemory_BigBirdRito
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.

Manual_MelodyOfMemory_BigBirdRito:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  goal:
    # Here you can decide whether your goal should be to collect Songs, Items, or Stars! Or you could choose to aim for all three!
    melody of memory's end [songs goal]: 50
    melody of memory's end [items goal]: 0
    melody of memory's end [stars goal]: 0
    melody of memory's end [ultima goal]: 0

  death_link:
    # When you lose a song you send a Death Link! When you recieve a Death Link you'll need to restart your current song from the beginning!
    'false': 50
    'true': 0

  songs_goal:
    # If you've picked the Songs Goal or Ultima Goal, how many Songs should be needed to unlock the victory location?
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 150
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-150: 0 # random value between 0 and 150

  items_goal:
    # If you've picked the Items Goal or Ultima Goal, how many Items should be needed to unlock the victory location?
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 150
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-150: 0 # random value between 0 and 150

  stars_goal:
    # If you've picked the Stars Goal or Ultima Goal, how many Stars should be needed to unlock the victory location?
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 150
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-150: 0 # random value between 0 and 150

  songs:
    # Should Song Items and Locations be enabled? Song items are used as location requirements in this apworld so setting this option to false causes everything but the goal to be in logic from the very start! (Each of these contain 150 items and locations! Multiworld pathing becomes much more linear with any of them disabled! Be careful not to disable all three of these options!)
    'false': 0
    'true': 50

  items:
    # Should Consumable Items and Locations be enabled? (Each of these contain 150 items and locations! Multiworld pathing becomes much more linear with any of them disabled! Be careful not to disable all three of these options!)
    'false': 0
    'true': 50

  stars:
    # Should Star Items and Locations be enabled? (Each of these contain 150 items and locations! Multiworld pathing becomes much more linear with any of them disabled! Be careful not to disable all three of these options!)
    'false': 0
    'true': 50

  kingdom_hearts:
    # 33 Songs, 11 Potions, 11 Mega-Potions, 11 Summoning Stars, 33 Stars
    'false': 0
    'true': 50

  chain_of_memories:
    # 5 Songs, 2 Potions, 1 Mega-Potion, 2 Summoning Stars, 5 Stars
    'false': 0
    'true': 50

  kingdom_hearts_ii:
    # 41 Songs, 13 Potions, 14 Mega-Potions, 14 Summoning Stars, 41 Stars
    'false': 0
    'true': 50

  days:
    # 6 Songs, 2 Potions, 2 Mega-Potions, 2 Summoning Stars, 6 Stars
    'false': 0
    'true': 50

  birth_by_sleep:
    # 26 Songs, 9 Potions, 8 Mega-Potions, 9 Summoning Stars, 26 Stars
    'false': 0
    'true': 50

  coded:
    # 2 Songs, 1 Potion, 1 Mega-Potion, 2 Stars
    'false': 0
    'true': 50

  dream_drop_distance:
    # 17 Songs, 6 Potions, 6 Mega-Potions, 5 Summoning Stars, 17 Stars
    'false': 0
    'true': 50

  a_fragmentary_passage:
    # 1 Song, 1 Mega-Potion, 1 Star
    'false': 0
    'true': 50

  kingdom_hearts_iii:
    # 11 Songs, 3 Potions, 4 Mega-Potions, 4 Summoning Stars, 11 Stars
    'false': 0
    'true': 50

  miscellaneous:
    # 8 Songs, 3 Potions, 2 Mega-Potions, 3 Summoning Stars, 8 Stars
    'false': 0
    'true': 50

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_inventory_from_pool:
    # Start with the specified amount of these items and don't place them in the world. Example: "Bomb: 1"
    # 
    # The game decides what the replacement items will be.
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
